name: Build Plugin

on:
  workflow_run:
    workflows: [ "Tag on Main Push" ]
    types:
      - completed

permissions:
  contents: write

jobs:
  check-tag:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        run: |
          LATEST_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"
          echo "Latest tag is $LATEST_TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Maven or Gradle
        run: |
          if [ -f "pom.xml" ]; then
            echo "Detected Maven project."
            mvn clean install
          elif [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            echo "Detected Gradle project."
            chmod +x ./gradlew
            ./gradlew build shadowJar
          else
            echo "No known build tool detected. Exiting."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.LATEST_TAG }}
          files: |
            target/*.jar
            build/libs/*.jar
          draft: false
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
