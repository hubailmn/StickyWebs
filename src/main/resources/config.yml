StickyWebs:
  debug: false

  block-reset:
    # Enable automatic block removal
    enabled: true
    # Time (in seconds) after a placed block is removed
    delay-seconds: 180
    # List of materials affected (leave empty to apply to all)
    blocks:
      - COBWEB
      - OAK_STAIRS
      - OAK_BUTTON

  hitbox-inflate:
    # Horizontal hitbox shrink (X-axis)
    X-axis: -0.22
    # Vertical hitbox shrink (Y-axis)
    Y-axis: -0.02
    # Depth hitbox shrink (Z-axis)
    Z-axis: -0.22

  cobwebs:
    # Prevent players from using firework rockets while inside cobwebs
    disable-firework-use-in-webs: true

    # Prevent players from gliding (elytra) if they are inside cobwebs
    disable-glide-In-Webs: true

    # Prevent players from flying through cobwebs
    disable-fly-through-Webs: true

  explosives:
    tnt-minecart-boost:
      # Enable or disable TNT minecart boost handling by the plugin
      enabled: true

      # Speed multiplier to apply when the TNT minecart leaves a powered rail
      boost-multiplier: 10

      # Only boost if minecart was originally placed on a powered rail
      must-be-powered: true

      # Blocks that count as rails for boost detection
      valid-rail-blocks:
        - POWERED_RAIL
        - DETECTOR_RAIL
        - ACTIVATOR_RAIL

    tnt:
      # Enable or disable TNT explosion handling by the plugin
      enabled: true

      # Custom explosion power for TNT (default vanilla is 4.0)
      explosion-power: 9.0

    tnt-minecart:
      # Enable or disable Minecart TNT explosion handling
      enabled: true

      # Custom explosion power for Minecart TNT (default vanilla is 4.0)
      explosion-power: 9.0
