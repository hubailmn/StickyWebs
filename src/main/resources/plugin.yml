name: StickyWebs
version: 1.0-v1.20.4
main: cc.hubailmn.stickywebs.StickyWebs
api-version: "1.20"
authors:
  - hubailmn
website: https://discord.hubailmn.cc
description: "A Sticky Webs for 1.20.4 plugin using NMS and Paperweight"
commands:
  stickyWeb:
    permission: StickyWeb.command
permissions:
  StickyWeb.command.reload:
    description: To reload the config values.
    default: op
  StickyWeb.command.bypass:
    description: To bypass the block placed auto reset.
    default: op